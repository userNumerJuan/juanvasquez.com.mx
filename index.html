<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#e9eee2">
  <meta name="description" content="Una pequeña aventura de elegir un plan.">
  <title>Un pequeño plan ✨</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/baloo-2-700.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/nunito-400.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="background-doodles" aria-hidden="true">
    <span class="doodle doodle-one">✿</span>
    <span class="doodle doodle-two">✦</span>
    <svg class="doodle-path" viewBox="0 0 180 100" fill="none"><path d="M4 84C40 4 94 110 176 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 9"/></svg>
  </div>
  <div class="app-shell">
    <header class="app-header">
      <button class="icon-button" id="back-button" type="button" aria-label="Volver a la pantalla anterior" hidden>←</button>
      <a class="brand" href="./" aria-label="Ir al inicio">algo bonito <span>✿</span></a>
      <div class="progress" id="progress" aria-label="Progreso"></div>
    </header>
    <main id="app" class="app-content" aria-live="polite"></main>
    <footer class="app-footer">hecho con un poquito de valentía <span aria-hidden="true">↗</span></footer>
  </div>
  <noscript><p class="noscript">Activa JavaScript para poder elegir tu plan. 🌱</p></noscript>
</body>
</html>
